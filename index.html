<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- PWA Primary Meta Tags -->
    <meta name="theme-color" content="#0B0F19" />
    <meta name="description" content="Sri Vasavi Plywoods Hardware CRM and Follow-up Management Engine. Track pipeline deals, document notes, manage collection transactions, and generate professional PDF statements." />
    <title>Sri Vasavi Plywoods | CRM &amp; Follow-up Management Engine</title>
    
    <!-- iOS / Apple PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vasavi CRM" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
  </head>
  <body>
    <div id="root">
      <!-- Premium Glassmorphic Brand Startup Loading Screen -->
      <div style="
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        background: #0B0F19;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        color: #ffffff;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      ">
        <div style="
          display: flex;
          flex-direction: column;
          align-items: center;
          background: rgba(17, 24, 39, 0.45);
          backdrop-filter: blur(12px);
          -webkit-backdrop-filter: blur(12px);
          border: 1px solid rgba(249, 115, 22, 0.15);
          padding: 2.5rem 2rem;
          border-radius: 24px;
          box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
          max-width: 320px;
          width: 85%;
          text-align: center;
        ">
          <!-- Premium Logo Emblem -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="84" height="84" style="margin-bottom: 1.5rem;">
            <!-- Outer Ring (Gold) -->
            <circle cx="50" cy="50" r="48" fill="#000000" stroke="#D4A64F" stroke-width="1.5" />
            
            <!-- Path for Text (Slightly inside the circle) -->
            <path id="text-path-load" d="M 18,58 A 32,32 0 1,1 82,58" fill="none" />
            
            <!-- Top Text -->
            <text fill="#ffffff" font-size="4.2" font-family="'Georgia', serif" font-weight="bold" letter-spacing="1">
              <textPath href="#text-path-load" startOffset="0%">
                SRI VASAVI PLYWOOD SINCE 1997
              </textPath>
            </text>
            
            <!-- Central Svp Logo -->
            <text x="25" y="66" fill="#D4A64F" font-size="42" font-family="'Georgia', serif" font-weight="bold">S</text>
            <text x="53" y="62" fill="#D4A64F" font-size="24" font-family="'Georgia', serif" font-weight="bold" letter-spacing="0.5">VP</text>
            
            <!-- Wavy Lines at the Bottom -->
            <path d="M 22,70 C 30,85 45,85 55,78 C 65,70 75,70 82,74" fill="none" stroke="#D4A64F" stroke-width="0.6" opacity="0.6" />
            <path d="M 24,73 C 32,87 47,86 57,80 C 67,73 77,72 84,76" fill="none" stroke="#D4A64F" stroke-width="0.4" opacity="0.4" />
            <path d="M 26,76 C 34,89 49,87 59,82 C 69,75 79,74 86,78" fill="none" stroke="#D4A64F" stroke-width="0.3" opacity="0.3" />
          </svg>
          
          <h2 style="
            margin: 0 0 0.4rem 0;
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #ffffff;
          ">Vasavi CRM</h2>
          <p style="
            margin: 0 0 2.2rem 0;
            font-size: 0.85rem;
            color: #94A3B8;
            font-weight: 500;
          ">Plywoods &amp; Hardware Engine</p>
          
          <!-- Modern Spinner -->
          <div style="
            width: 36px;
            height: 36px;
            border: 3px solid rgba(249, 115, 22, 0.15);
            border-top-color: #F97316;
            border-radius: 50%;
            animation: spin 1s infinite linear;
          "></div>
        </div>
      </div>
      <style>
        @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
        body {
          margin: 0;
          background: #0B0F19;
        }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
